<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" fill="#fff">
  <!-- NEXUS mark: two tilted controller grips (d-pad left, face buttons right) flanking a geometric N.
       Original artwork for the NEXUS project. -->
  <defs>
    <path id="grip" d="M-40,-36 C-40,-60 -24,-68 0,-68 C24,-68 40,-60 40,-36 L30,46 C28,61 17,68 0,68 C-17,68 -28,61 -30,46 Z"/>
    <mask id="cutL" maskUnits="userSpaceOnUse" x="-60" y="-80" width="120" height="160">
      <rect x="-60" y="-80" width="120" height="160" fill="#fff"/>
      <path d="M-6.5,-46 h13 v13 h13 v13 h-13 v13 h-13 v-13 h-13 v-13 h13 Z" fill="#000" transform="translate(0,6)"/>
      <circle cx="0" cy="34" r="11" fill="#000"/>
    </mask>
    <mask id="cutR" maskUnits="userSpaceOnUse" x="-60" y="-80" width="120" height="160">
      <rect x="-60" y="-80" width="120" height="160" fill="#fff"/>
      <circle cx="0" cy="-41" r="6.5" fill="#000"/>
      <circle cx="0" cy="-13" r="6.5" fill="#000"/>
      <circle cx="-14" cy="-27" r="6.5" fill="#000"/>
      <circle cx="14" cy="-27" r="6.5" fill="#000"/>
      <circle cx="0" cy="34" r="11" fill="#000"/>
    </mask>
  </defs>
  <g id="nx-gripL" transform="translate(110,118) rotate(-14)"><use href="#grip" mask="url(#cutL)"/></g>
  <g id="nx-gripR" transform="translate(370,118) rotate(14)"><use href="#grip" mask="url(#cutR)"/></g>
  <g id="nx-mark" transform="translate(240,118)">
    <path d="M-38,52 V-52 L38,52 V-52" fill="none" stroke="#fff" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g id="nx-word" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(240,248)">
    <path d="M-110,14 V-14 L-86,14 V-14"/>
    <path d="M-44,-14 H-64 V14 H-44 M-64,0 H-48"/>
    <path d="M-24,-14 L4,14 M4,-14 L-24,14"/>
    <path d="M26,-14 V4 C26,10 30,14 38,14 C46,14 50,10 50,4 V-14"/>
    <path d="M94,-11 C91,-13 87,-14 82,-14 C75,-14 71,-11 71,-6 C71,4 95,-2 95,7 C95,12 90,14 83,14 C78,14 74,13 70,10"/>
  </g>
