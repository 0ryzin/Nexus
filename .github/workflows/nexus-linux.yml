# NEXUS for Linux: the engine (upstream Lichii + engine/patches) and NEXUS for AMD64 and ARM64,
# tested and packed as an AppImage and a tar.gz per architecture. One AMD64 build serves every
# AMD64 Linux PC and the Steam Deck (docs/LINUX.md). Releases are never published from here.
name: nexus-linux

on:
  push:
    branches: [main, "build/**"]
  workflow_dispatch:
    inputs:
      engine_run:
        description: "Reuse the engines of this nexus-linux run (id) instead of building them; only if engine/patches and engine.lock are unchanged (checked)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    name: Engine (Linux ${{ matrix.arch }})
    if: ${{ !inputs.engine_run }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/engine-src/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      - name: Read engine.lock
        id: lock
        run: |
          set -euo pipefail
          get() { grep "^$1=" app/engine.lock | cut -d= -f2; }
          echo "repo=$(get upstream)" >> "$GITHUB_OUTPUT"
          echo "commit=$(get upstreamCommit)" >> "$GITHUB_OUTPUT"
          echo "base=$(get upstreamBase)" >> "$GITHUB_OUTPUT"
          echo "version=$(get version)" >> "$GITHUB_OUTPUT"

      - name: Check out the upstream engine base
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.repo }}
          ref: ${{ steps.lock.outputs.commit }}
          path: engine-src
          fetch-depth: 1
          persist-credentials: false

      - name: Apply the NEXUS engine patches
        working-directory: engine-src
        run: |
          set -euo pipefail
          git tag "${{ steps.lock.outputs.base }}" HEAD
          git -c user.name="NEXUS CI" -c user.email="nexus-ci@users.noreply.github.com" am ../engine/patches/*.patch

      # the packages upstream's Linux builds use, without Qt (the engine library has no Qt)
      # Ubuntu's AMD64 mirror for the runners is slow at times (10-15 min per install): the .deb
      # files are cached, so apt only unpacks them
      - name: Restore downloaded packages
        id: apt-0
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-install-build-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/nexus-linux.yml') }}
          restore-keys: apt-install-build-dependencies-${{ runner.os }}-${{ runner.arch }}-
      - name: Use the cached packages
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev mesa-common-dev nasm ninja-build \
            pkg-config zlib1g-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache python3-zstandard \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libdbus-1-dev libibus-1.0-dev \
            mesa-vulkan-drivers patchelf meson \
            libxtst-dev libxfixes-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libpipewire-0.3-dev
          mkdir -p ~/apt-archives && cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
      - name: Save downloaded packages
        if: steps.apt-0.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-install-build-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/nexus-linux.yml') }}

      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@v4
        with:
          path: |
            engine-src/.cache/cpm
            engine-src/.ccache
          key: nexus-linux-${{ matrix.arch }}-${{ steps.lock.outputs.commit }}-${{ github.run_id }}
          restore-keys: |
            nexus-linux-${{ matrix.arch }}-${{ steps.lock.outputs.commit }}-
            nexus-linux-${{ matrix.arch }}-

      # dav1d (AV1) for the engine's FFmpeg: Switch 2 titles' movies are AV1 (Ocarina of Time's
      # title-screen background). Static and position-independent, linked into the engine
      # (engine patch 0044, LICHII_FFMPEG_DAV1D_DIR); no system copy is needed at run time.
      - name: Build dav1d
        run: |
          set -euo pipefail
          v=1.5.1
          curl -fsSL "https://code.videolan.org/videolan/dav1d/-/archive/$v/dav1d-$v.tar.gz" -o /tmp/dav1d.tgz
          echo "dav1d $v: $(sha256sum /tmp/dav1d.tgz | cut -c1-16)"
          mkdir -p /tmp/dav1d-src && tar -xzf /tmp/dav1d.tgz -C /tmp/dav1d-src --strip-components=1
          meson setup /tmp/dav1d-build /tmp/dav1d-src --buildtype=release --default-library=static \
            -Db_staticpic=true -Denable_tools=false -Denable_tests=false --prefix="$RUNNER_TEMP/dav1d" --libdir=lib
          ninja -C /tmp/dav1d-build install >/dev/null
          ls -la "$RUNNER_TEMP/dav1d/lib/libdav1d.a"

      # FFmpeg is built from source too, static and position-independent with only the decoders the
      # engine uses (H.264, VP8, VP9) and no VA-API/VDPAU: the system's libavcodec differs between
      # distributions (Ubuntu 24.04 has .so.60, Arch .so.61) and is not on every Steam Deck.
      # -Bsymbolic: FFmpeg's x86 assembly refers to its own tables PC-relatively, which a shared
      # library allows only when its symbols bind locally (FFmpeg's advice for static linking).
      # SDL3 is built from source (cpmfile.json: 3.4.20 with libusb, engine patch 0031): the prebuilt
      # static SDL3 is not position-independent on ARM64, and has no libusb (Switch 2 over USB)
      - name: Configure the engine
        working-directory: engine-src
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEXUS_ENGINE=ON \
            -DNEXUS_ENGINE_VERSION=${{ steps.lock.outputs.version }} \
            -DBUILD_TESTING=ON -DLICHII_TESTS=ON \
            -DENABLE_QT=OFF -DLICHII_CMD=OFF -DLICHII_ROOM=OFF -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_USE_BUNDLED_SDL3=OFF \
            -DLICHII_USE_BUNDLED_FFMPEG=OFF -DLICHII_USE_EXTERNAL_FFMPEG=ON -DLICHII_FFMPEG_DAV1D_DIR="$RUNNER_TEMP/dav1d" \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DENABLE_WEB_SERVICE=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WERROR=OFF -DUSE_CCACHE=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-Bsymbolic"

      - name: Build the engine and its tests
        working-directory: engine-src
        run: |
          ccache -z || true
          cmake --build build --target nexus_engine tests config_tests profile_import_tests --parallel "$(nproc)"
          ccache -s || true

      - name: Save dependencies and compiler objects
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            engine-src/.cache/cpm
            engine-src/.ccache
          key: nexus-linux-${{ matrix.arch }}-${{ steps.lock.outputs.commit }}-${{ github.run_id }}

      - name: Engine tests (gate)
        working-directory: engine-src
        run: |
          set -euo pipefail
          ls build/bin
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            # [jit_codegen_options] compares dynarmic's x86-64 code generation options; upstream runs it
            # on x86-64 only, and on an ARM64 host its random blocks abort in dynarmic's ARM64 backend
            # (an upstream limitation, recorded in docs/LINUX.md). Everything else runs.
            ./build/bin/tests "~[jit_codegen_options]"
          else
            ./build/bin/tests
          fi
          ./build/bin/config_tests
          ./build/bin/profile_import_tests

      - name: Engine interface smoke test
        working-directory: engine-src
        run: |
          set -euo pipefail
          lib=$(find build -name nexus_engine.so -type f | head -1); test -n "$lib"
          echo "library: $lib"; ldd "$lib"
          python3 tools/nexus/abi_smoke.py "$lib"

      - name: Collect the engine
        working-directory: engine-src
        run: |
          set -euo pipefail
          mkdir -p ../engine-out
          lib=$(find build -name nexus_engine.so -type f | head -1); test -n "$lib"
          cp "$lib" ../engine-out/
          # shared libraries the build produced that the engine links (bundled SDL3 etc.)
          for d in $(ldd "$lib" | awk '/=> \//{print $3}'); do
            case "$d" in "$PWD"/*) cp -L "$d" ../engine-out/ ;; esac
          done
          # system libraries the engine needs: only ones every Linux desktop and SteamOS has. Libraries
          # whose version differs between distributions (FFmpeg, Boost, SDL ...; stable sonames such as OpenSSL 3, libusb-1.0, lz4, zstd, opus are fine) must be
          # built in, or the tar.gz and AppImage would not load on other systems
          echo "NEEDED:"; readelf -d "$lib" | awk '/NEEDED/{print "  "$5}'
          if readelf -d "$lib" | awk '/NEEDED/{print $5}' | grep -E 'libav|libsw|libva|libvdpau|libboost|libfmt|libSDL|libenet|libcurl|libvpx|libdav1d|libx26'; then
            echo "::error::the engine links a distribution-specific library (above)"; exit 1
          fi
          git log -1 --format=%H > ../engine-out/COMMIT
          # what the engine was built from: a package job reusing it checks this against its own
          (cat ../app/engine.lock; cat ../engine/patches/*.patch) | sha256sum | cut -d' ' -f1 > ../engine-out/SOURCE
          ls -la ../engine-out

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-engine-linux-${{ matrix.arch }}
          path: engine-out
          retention-days: 7

  package:
    name: NEXUS for Linux ${{ matrix.arch }} (AppImage, tar.gz)
    needs: engine
    if: ${{ always() && (needs.engine.result == 'success' || (inputs.engine_run && needs.engine.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            ai: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            ai: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Read engine.lock
        id: lock
        run: |
          get() { grep "^$1=" app/engine.lock | cut -d= -f2; }
          echo "repo=$(get upstream)" >> "$GITHUB_OUTPUT"
          echo "commit=$(get upstreamCommit)" >> "$GITHUB_OUTPUT"
          echo "base=$(get upstreamBase)" >> "$GITHUB_OUTPUT"
          echo "NEXUS_VERSION=$(tr -d ' \r\n' < app/VERSION)" >> "$GITHUB_ENV"

      # the engine's corresponding source goes into the download (Source/engine)
      - name: Check out the upstream engine base
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.repo }}
          ref: ${{ steps.lock.outputs.commit }}
          path: engine-src
          fetch-depth: 1
          persist-credentials: false
      - name: Apply the NEXUS engine patches
        working-directory: engine-src
        run: git -c user.name="NEXUS CI" -c user.email="nexus-ci@users.noreply.github.com" am ../engine/patches/*.patch

      - uses: actions/download-artifact@v4
        with:
          name: nexus-engine-linux-${{ matrix.arch }}
          path: engine-out
          run-id: ${{ inputs.engine_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: The engine was built from these engine sources
        run: |
          want=$( (cat app/engine.lock; cat engine/patches/*.patch) | sha256sum | cut -d' ' -f1)
          got=$(cat engine-out/SOURCE 2>/dev/null || true)
          echo "engine sources: built $got, here $want"
          [[ "$got" == "$want" ]] || { echo "::error::the engine was built from other engine sources"; exit 1; }

      # Ubuntu's AMD64 mirror for the runners is slow at times (10-15 min per install): the .deb
      # files are cached, so apt only unpacks them
      - name: Restore downloaded packages
        id: apt-1
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-install-build-and-packaging-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/nexus-linux.yml') }}
          restore-keys: apt-install-build-and-packaging-dependencies-${{ runner.os }}-${{ runner.arch }}-
      - name: Use the cached packages
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev patchelf file desktop-file-utils xvfb xauth imagemagick \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-tools \
            libfuse2t64 squashfs-tools zsync
          mkdir -p "$RUNNER_TEMP/tools"; cd "$RUNNER_TEMP/tools"
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.ai }}.AppImage
          curl -fsSLo linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.ai }}.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh appimagetool
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          mkdir -p ~/apt-archives && cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
      - name: Save downloaded packages
        if: steps.apt-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-install-build-and-packaging-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/nexus-linux.yml') }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: app/go.sum

      - name: Build NEXUS (Linux window, WebKitGTK)
        working-directory: app
        run: |
          set -euo pipefail
          go vet -tags webkitgtk .
          CGO_ENABLED=1 go build -tags webkitgtk -trimpath -ldflags "-s -w -X main.AppVersion=$NEXUS_VERSION" -o "$RUNNER_TEMP/nexus" .
          file "$RUNNER_TEMP/nexus"

      - name: Make the downloads
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          python3 tools/release/make_linux.py --version "$NEXUS_VERSION" --arch ${{ matrix.arch }} \
            --bin "$RUNNER_TEMP/nexus" --engine-dir ../engine-out --engine-source ../engine-src \
            --engine-patches ../engine/patches --linuxdeploy "$RUNNER_TEMP/tools/linuxdeploy" \
            --appimagetool "$RUNNER_TEMP/tools/appimagetool" --out ../out
          ls -la ../out

      # what a user does: a fresh extract / the AppImage as downloaded, then the engine check
      - name: Check the tar.gz (fresh extract, engine check)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/fresh"; mkdir -p "$d"
          tar -xzf out/NEXUS-*-Linux-${{ matrix.arch }}.tar.gz -C "$d"
          for f in nexus Engine/nexus_engine.so Engine/engine.json README-Linux.txt Resources Licences; do test -e "$d/NEXUS/$f" || { echo "::error::$f missing"; exit 1; }; done
          test -x "$d/NEXUS/nexus"
          readelf -d "$d/NEXUS/Engine/nexus_engine.so" | grep -E 'RUNPATH|RPATH'
          ldd "$d/NEXUS/Engine/nexus_engine.so" | tee "$RUNNER_TEMP/engine-ldd.txt"
          ! grep -q "not found" "$RUNNER_TEMP/engine-ldd.txt"
          "$d/NEXUS/nexus" --engine-check "$RUNNER_TEMP/tar-check.json" || true
          cat "$RUNNER_TEMP/tar-check.json"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); sys.exit(0 if r.get('ready') else 1)" "$RUNNER_TEMP/tar-check.json"

      - name: Check the AppImage (engine check; the interface starts in a virtual display)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          ai=$(ls out/NEXUS-*-Linux-${{ matrix.arch }}.AppImage)
          test -x "$ai"; file "$ai"
          "$PWD/$ai" --engine-check "$RUNNER_TEMP/ai-check.json" || true
          cat "$RUNNER_TEMP/ai-check.json"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); sys.exit(0 if r.get('ready') else 1)" "$RUNNER_TEMP/ai-check.json"
          # a sound server with a silent sink: the interface's start-up sound must arrive there
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils >/dev/null
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --disallow-exit
          pactl load-module module-null-sink sink_name=nexus_null >/dev/null
          pactl set-default-sink nexus_null
          NEXUS_SMOKE_AUDIO=1 bash app/tools/release/linux/smoke.sh "$PWD/$ai" "$RUNNER_TEMP/smoke-host" host

      # the AppImage on systems without WebKitGTK installed: Arch Linux (what SteamOS is built on)
      # and plain Ubuntu, each with only a virtual display added (Ubuntu also gets GTK 3 and ALSA,
      # which every desktop has, for the base libraries AppImages leave to the system: fonts,
      # text shaping, X11; SteamOS's desktop has them too)
      - name: AppImage on Arch Linux and plain Ubuntu (no WebKitGTK installed)
        run: |
          set -euo pipefail
          ai=$(ls out/NEXUS-*-Linux-${{ matrix.arch }}.AppImage)
          if [ "${{ matrix.arch }}" = amd64 ]; then
            docker run --rm -v "$PWD:/w" -w /w archlinux:latest bash -c \
              "pacman -Sy --noconfirm --needed xorg-server-xvfb xorg-xauth imagemagick mesa >/dev/null && APPIMAGE_EXTRACT_AND_RUN=1 bash app/tools/release/linux/smoke.sh /w/$ai /w/smoke-arch arch"
          fi
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c \
            "apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth imagemagick libgl1 libegl1 libgles2 libgbm1 libdrm2 libasound2t64 libgtk-3-0t64 >/dev/null && ! ls /usr/lib/*/libwebkit2gtk-4.1.so* 2>/dev/null && APPIMAGE_EXTRACT_AND_RUN=1 bash app/tools/release/linux/smoke.sh /w/$ai /w/smoke-ubuntu ubuntu"

      # for testers: each download on its own, not zipped (a direct file, like on a release page)
      - name: Find the downloads
        id: files
        run: |
          echo "appimage=$(ls out/NEXUS-*-Linux-${{ matrix.arch }}.AppImage)" >> "$GITHUB_OUTPUT"
          echo "tar=$(ls out/NEXUS-*-Linux-${{ matrix.arch }}.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.appimage }}
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.tar }}
          archive: false
          retention-days: 14
      # everything with the test logs and screenshots, for the release workflow and diagnosis. Its
      # name says it is not a download: testers take the AppImage or tar.gz above, each on its own
      # (this bundle unpacks to out/ with both, which looked like one nested download)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zz-release-bundle-linux-${{ matrix.arch }}-not-a-download
          path: |
            out/*
            smoke-*/*.png
            smoke-*/*.log
            ${{ runner.temp }}/smoke-host/*.png
            ${{ runner.temp }}/smoke-host/*.log
          retention-days: 14
