# Fast check of the NEXUS capture module only (the full release build also runs it).
name: NEXUS capture module
on:
  push:
    branches: ["capture-dev", "capture-dev/**"]
  workflow_dispatch:
jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Build
        shell: pwsh
        run: |
          cmake -S capture -B build-capture -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-capture
      - name: Self-test (generated video and audio -> MP4 -> read back)
        shell: pwsh
        run: |
          cd build-capture
          ./nexus_capture_test.exe "$PWD\selftest.mp4" "$PWD\window.mp4"
          if ($LASTEXITCODE -ne 0) { throw "capture self-test failed" }
          Get-Item selftest.mp4 | Format-List Name,Length
