# NEXUS build: one Windows job builds the NEXUS engine (upstream Lichii + engine/patches) and
# NEXUS.exe, tests both, and packs them into one NEXUS-<version>-Windows-x64.zip. The ZIP is only
# produced when every step passes, and it is checked again after a fresh extract: the engine is
# loaded from the extracted folder by NEXUS.exe itself (NEXUS.exe --engine-check).
name: nexus-build

on:
  push:
    branches: [main, "build/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-build-${{ github.ref }}
  # a newer push waits for the running build (whose compiler cache the next one reuses)
  cancel-in-progress: false

jobs:
  app-tests:
    name: NEXUS tests (Linux, fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: app/go.sum
      - run: go vet .
      - run: go test -count=1 .

  windows:
    name: Engine + NEXUS (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      SCCACHE_DIR: ${{ github.workspace }}/engine-src/.sccache
      SCCACHE_CACHE_SIZE: 3G
    steps:
      # patches must be applied byte for byte: no line-ending conversion in either checkout
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out NEXUS
        uses: actions/checkout@v4

      # the NEXUS version is app/VERSION; a release tag must match it (v<version>)
      - name: NEXUS version
        shell: bash
        run: |
          set -euo pipefail
          v=$(tr -d ' \r\n' < app/VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app/VERSION ($v)"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "::error::docs/releases/$GITHUB_REF_NAME.md (release notes) is missing"; exit 1; }
          fi
          echo "NEXUS_VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: app/go.sum

      - name: NEXUS tests on Windows (gate, before the long engine build)
        working-directory: app
        run: go test -count=1 .

      - name: Read engine.lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          get() { grep "^$1=" app/engine.lock | cut -d= -f2; }
          echo "repo=$(get upstream)" >> "$GITHUB_OUTPUT"
          echo "commit=$(get upstreamCommit)" >> "$GITHUB_OUTPUT"
          echo "base=$(get upstreamBase)" >> "$GITHUB_OUTPUT"
          echo "version=$(get version)" >> "$GITHUB_OUTPUT"
          echo "patchset=$(python -c "import hashlib,os;d='engine/patches';h=hashlib.sha256();[h.update(open(os.path.join(d,n),'rb').read()) for n in sorted(os.listdir(d)) if n.endswith('.patch')];print(h.hexdigest())")" >> "$GITHUB_OUTPUT"

      - name: Check out the upstream engine base
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.repo }}
          ref: ${{ steps.lock.outputs.commit }}
          path: engine-src
          fetch-depth: 1
          persist-credentials: false

      - name: Apply the NEXUS engine patches
        shell: bash
        working-directory: engine-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.lock.outputs.commit }}"
          git tag "${{ steps.lock.outputs.base }}" HEAD
          git -c user.name="NEXUS CI" -c user.email="nexus-ci@users.noreply.github.com" \
            am ../engine/patches/*.patch
          git log --oneline -12

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # screen recording module (capture/): built with MSVC and tested before the long engine build
      - name: Build the NEXUS capture module
        shell: pwsh
        run: |
          cmake -S capture -B build-capture -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          cmake --build build-capture
          if ($LASTEXITCODE -ne 0) { throw "capture module build failed" }

      - name: Capture module self-test (video + audio -> MP4 -> read back; a real window)
        shell: pwsh
        working-directory: build-capture
        run: |
          ./nexus_capture_test.exe "$PWD\selftest.mp4" "$PWD\window.mp4"
          if ($LASTEXITCODE -ne 0) { throw "capture self-test failed" }

      - name: Install LLVM (clang-cl, as upstream's Windows builds use)
        shell: pwsh
        working-directory: engine-src
        run: ./tools/windows/install-llvm.ps1

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install the Vulkan SDK
        shell: pwsh
        working-directory: engine-src
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v4
        with:
          path: engine-src/.cache/cpm
          key: nexus-cpm-${{ steps.lock.outputs.commit }}-${{ hashFiles('engine/patches/*.patch') }}
          restore-keys: |
            nexus-cpm-${{ steps.lock.outputs.commit }}-
            nexus-cpm-

      - name: Restore compiler objects
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: engine-src/.sccache
          key: nexus-objects-${{ steps.lock.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nexus-objects-${{ steps.lock.outputs.commit }}-
            nexus-objects-

      - name: Configure the engine
        shell: bash
        working-directory: engine-src
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEXUS_ENGINE=ON \
            -DNEXUS_ENGINE_VERSION=${{ steps.lock.outputs.version }} \
            -DBUILD_TESTING=ON \
            -DYUZU_TESTS=ON \
            -DENABLE_QT=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WERROR=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: engine-src/.cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build the engine and its tests
        shell: bash
        working-directory: engine-src
        run: |
          sccache --zero-stats || true
          cmake --build build --target nexus_engine tests config_tests profile_import_tests --parallel
          sccache --show-stats || true

      - name: Save compiler objects
        if: always() && steps.objects.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: engine-src/.sccache
          key: ${{ steps.objects.outputs.cache-primary-key }}

      - name: Engine tests (gate)
        shell: bash
        working-directory: engine-src
        run: |
          ls build/bin
          ./build/bin/tests.exe
          # configuration and data-folder tests (includes the NEXUS host-managed folder case)
          ./build/bin/config_tests.exe
          ./build/bin/profile_import_tests.exe

      - name: Engine interface smoke test
        working-directory: engine-src
        run: python tools/nexus/abi_smoke.py build/bin/nexus_engine.dll

      - name: Package the engine
        working-directory: engine-src
        shell: bash
        env:
          NEXUS_ENGINE_UPSTREAM_BASE: ${{ steps.lock.outputs.base }}
          NEXUS_ENGINE_PATCHSET: ${{ steps.lock.outputs.patchset }}
        # package_engine.py takes the version from GITHUB_REF_NAME; the runner's own value (the
        # branch name) wins over a step env entry, so it is set on the command itself
        run: GITHUB_REF_NAME="engine-v${{ steps.lock.outputs.version }}" python tools/nexus/package_engine.py build/bin ../engine-out

      - name: Build NEXUS.exe
        working-directory: app
        shell: bash
        # Windows version resource (CompanyName "Nexus Development", version) from app/VERSION;
        # application metadata only, not a signature (docs/SIGNING.md)
        run: python tools/release/make_rsrc.py --version "$NEXUS_VERSION" && go build -ldflags "-H windowsgui -s -w -X main.AppVersion=$NEXUS_VERSION" -o NEXUS.exe .

      - name: Make the NEXUS ZIP (NEXUS + engine)
        working-directory: app
        shell: bash
        run: |
          python tools/release/make_release.py --version "$NEXUS_VERSION" --exe NEXUS.exe \
            --engine ../engine-out/nexus-engine-${{ steps.lock.outputs.version }}-win64.zip \
            --engine-patches ../engine/patches --engine-source ../engine-src \
            --capture ../build-capture/nexus_capture.dll --out ../out

      - name: Fresh-extract check (what a user does)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $z = Get-ChildItem out/*.zip | Select-Object -First 1
          $fresh = Join-Path $env:RUNNER_TEMP 'fresh extract'
          Expand-Archive $z.FullName -DestinationPath $fresh
          $n = Join-Path $fresh 'NEXUS'
          foreach ($f in 'NEXUS.exe', 'nexus_capture.dll', 'Engine/nexus_engine.dll', 'Engine/engine.json') {
            if (!(Test-Path (Join-Path $n $f))) { throw "$f missing from the ZIP" }
          }
          # every DLL the engine imports is either in the package or a Windows system DLL
          $libs = @(Get-ChildItem (Join-Path $n 'Engine') -Recurse -Filter *.dll | ForEach-Object { $_.Name.ToLower() })
          $deps = dumpbin /dependents (Join-Path $n 'Engine/nexus_engine.dll') | Select-String '^\s+(\S+\.dll)$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() }
          foreach ($d in $deps) {
            $inPkg = $libs -contains $d
            # api-ms-win-* / ext-ms-* are Windows API sets, resolved by the loader itself
            $inSys = ($d -like 'api-ms-win-*') -or ($d -like 'ext-ms-*') -or (Test-Path (Join-Path $env:WINDIR "System32/$d"))
            # the VC++ runtime must come with NEXUS: users may not have the Redistributable
            $crt = ($d -like 'vcruntime140*') -or ($d -like 'msvcp140*') -or ($d -like 'concrt140*')
            Write-Host "$d  package=$inPkg system=$inSys"
            if ($crt -and !$inPkg) { throw "$d (VC++ runtime) is not bundled" }
            if (!$inPkg -and !$inSys) { throw "$d is needed by the engine but not in the package" }
          }
          python engine-src/tools/nexus/abi_smoke.py (Join-Path $n 'Engine/nexus_engine.dll')
          # the capture module needs only Windows itself (static C++ runtime)
          $cdeps = dumpbin /dependents (Join-Path $n 'nexus_capture.dll') | Select-String '^\s+(\S+\.dll)$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() }
          foreach ($d in $cdeps) {
            $inSys = ($d -like 'api-ms-win-*') -or ($d -like 'ext-ms-*') -or (Test-Path (Join-Path $env:WINDIR "System32/$d"))
            Write-Host "capture: $d  system=$inSys"
            if (!$inSys) { throw "nexus_capture.dll needs $d, which Windows does not provide" }
          }
          # the packaged capture module records (test program run next to the extracted DLL)
          $ct = Join-Path $env:RUNNER_TEMP 'capture-check'
          New-Item -ItemType Directory -Force $ct | Out-Null
          Copy-Item (Join-Path $n 'nexus_capture.dll') $ct
          Copy-Item build-capture/nexus_capture_test.exe $ct
          & (Join-Path $ct 'nexus_capture_test.exe') (Join-Path $ct 'check.mp4')
          if ($LASTEXITCODE -ne 0) { throw "the packaged capture module failed its self-test" }
          # publisher metadata is in NEXUS.exe (not a signature)
          $vi = (Get-Item (Join-Path $n 'NEXUS.exe')).VersionInfo
          Write-Host "NEXUS.exe: CompanyName=$($vi.CompanyName) ProductName=$($vi.ProductName) FileVersion=$($vi.FileVersion)"
          if ($vi.CompanyName -ne 'Nexus Development' -or $vi.ProductVersion -ne $env:NEXUS_VERSION) { throw "NEXUS.exe version information is wrong" }
          # Another Switch emulator's data on the PC must not stop NEXUS (NEXUS 0.0.0 failed with
          # "Legacy emulator data or an unfinished import was found" in exactly this situation).
          foreach ($d in 'eden\keys', 'yuzu') { New-Item -ItemType Directory -Force (Join-Path $env:APPDATA $d) | Out-Null }
          # NEXUS.exe sets up its engine data and configuration, finds, verifies and loads its engine
          # exactly as on a user's PC, then has the engine prepare a session (--probe-start)
          $res = Join-Path $env:RUNNER_TEMP 'engine-check.json'
          $p = Start-Process -FilePath (Join-Path $n 'NEXUS.exe') -ArgumentList '--engine-check', "`"$res`"", '--probe-start' -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          Get-Content $res
          if ($p.ExitCode -ne 0) { throw "NEXUS.exe --engine-check failed (exit $($p.ExitCode))" }

      # a copy for testers; not a check, so a GitHub storage hiccup must not block the release
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          name: NEXUS-${{ env.NEXUS_VERSION }}-Windows-x64
          path: out/*
          retention-days: 30

      # A release is published when a v* tag is pushed, or when main is built with a version
      # (app/VERSION) that has no release yet and has its notes in docs/releases/v<version>.md.
      # Either way only after every check above has passed.
      - name: Should this build be released?
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="v$NEXUS_VERSION"; publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
          elif [[ ( "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ) && "$GITHUB_REF" == refs/heads/main ]]; then
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$tag is already released"
            elif [[ ! -f "docs/releases/$tag.md" ]]; then
              echo "::warning::no release notes (docs/releases/$tag.md), so $tag is not released"
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # the release page: a Windows download table generated from the ZIP that was built
          # (with its SHA-256), then the notes; checks the notes' sections and that no other
          # platform is offered
          if [[ "$publish" == true ]]; then
            python app/tools/release/release_body.py --version "$NEXUS_VERSION" --repo "$GITHUB_REPOSITORY" \
              --zip "out/NEXUS-$NEXUS_VERSION-Windows-x64.zip" --notes "docs/releases/$tag.md" --out out/release-body.md || exit 1
          fi

      - name: Publish the release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NEXUS ${{ env.NEXUS_VERSION }} — Windows x64
          body_path: out/release-body.md
          prerelease: ${{ contains(env.NEXUS_VERSION, '-') }}
          make_latest: ${{ !contains(env.NEXUS_VERSION, '-') }}
          files: |
            out/*.zip
            out/*.sha256

      # The page says "Available" with a direct link, so the link must work: the published
      # assets are downloaded again and checked against the build. If anything is missing or
      # different, the release goes back to draft (invisible to users) and the build fails.
      - name: Check the published downloads
        if: steps.rel.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${{ steps.rel.outputs.tag }}"; name="NEXUS-$NEXUS_VERSION-Windows-x64.zip"
          mkdir -p verify && cd verify
          ok=true
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$name" -p "$name.sha256" || ok=false
          if $ok; then
            want=$(cut -d' ' -f1 "../out/$name.sha256")
            got=$(sha256sum "$name" | cut -d' ' -f1)
            [[ "$want" == "$got" ]] && grep -q "$want" "$name.sha256" || ok=false
            echo "built $want, published $got"
          fi
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" -q '.assets | length')
          [[ "$n" == "2" ]] || { echo "::error::expected 2 assets, found $n"; ok=false; }
          if ! $ok; then
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=true
            echo "::error::the published download did not check out; $tag was set back to draft"; exit 1
          fi
          echo "$tag: $name is downloadable and matches the build"
